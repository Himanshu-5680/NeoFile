<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="NeoFile is an offline file desk for text, spreadsheets, and document previews. Nothing leaves this device." />
    <link rel="icon" href="/logo.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <title>NeoFile</title>
    <script>
      try {
        var raw = JSON.parse(localStorage.getItem("neofile-theme") || "null");
        var mode = raw && raw.mode;
        if (!mode && window.matchMedia("(prefers-color-scheme: dark)").matches) mode = "dark";
        if (mode === "dark") document.documentElement.dataset.theme = "dark";
        if (raw && typeof raw.accent === "string") {
          document.documentElement.style.setProperty("--accent", raw.accent);
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
