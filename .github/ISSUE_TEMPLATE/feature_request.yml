name: Feature request
description: A change that stays offline and does not pretend to be a full Office editor.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        NeoFile does not add accounts, sync, or analytics. Word and PowerPoint stay previews unless the change really writes those formats.
  - type: textarea
    id: problem
    attributes:
      label: What is hard to do in NeoFile today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What should it do?
      description: Say which file type is affected and whether the result is an edit or a preview.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Where should it work?
      multiple: true
      options:
        - Android
        - Windows
        - macOS
        - iOS
        - Linux
        - Browser
        - All of them
    validations:
      required: true
  - type: checkboxes
    id: offline
    attributes:
      label: Offline check
      options:
        - label: This can work with no network, no account, and no upload.
          required: true
