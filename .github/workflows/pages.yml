name: Pages

on:
  push:
    branches: [main]
    paths:
      - website/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy website
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the web desk
        env:
          VITE_NEOFILE_PWA: "1"
        run: npm run build --workspace @neofile/web
      - name: Copy the web desk into the site
        run: rm -rf website/desk && mkdir -p website/desk && cp -a apps/web/dist/. website/desk/
      - name: Require GitHub Pages to already be enabled
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/neofile-pages.json -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")"
          if [ "$code" = "200" ]; then
            exit 0
          fi
          echo "::error title=GitHub Pages is not enabled::A repository admin must open Settings, then Pages, then Build and deployment, then Source, and choose GitHub Actions. The workflow GITHUB_TOKEN cannot create the site. actions/configure-pages enablement:true fails with Resource not accessible by integration because that call needs a separate token with administration:write. HTTP ${code}."
          exit 1
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload the website directory
        uses: actions/upload-pages-artifact@v5
        with:
          path: website
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
