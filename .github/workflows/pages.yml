name: Pages

on:
  push:
    branches: [main]
    paths:
      - apps/web/**
      - packages/core/**
      - assets/logo-512.png
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy website
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the web app for the project site
        env:
          VITE_NEOFILE_PWA: "1"
        run: npm run build --workspace @neofile/web
      - name: Require GitHub Pages to already be enabled
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/neofile-pages.json -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")"
          if [ "$code" = "200" ]; then
            exit 0
          fi
          echo "::error title=GitHub Pages is not enabled::A repository admin must open Settings, then Pages, then Build and deployment, then Source, and choose GitHub Actions. The workflow GITHUB_TOKEN cannot create the site. actions/configure-pages enablement:true fails with Resource not accessible by integration because that call needs a separate token with administration:write. HTTP ${code}."
          exit 1
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload the web app
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_attempt }}
          path: apps/web/dist
      - name: Wait for the Pages artifact to be indexed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            response="$(curl -sS -f \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?name=${ARTIFACT_NAME}")"
            count="$(jq --arg artifact "${ARTIFACT_NAME}" '[.artifacts[] | select(.name == $artifact)] | length' <<<"$response")"
            if [[ "$count" == "1" ]]; then
              sleep 5
              exit 0
            fi
            if [[ "$count" -gt 1 ]]; then
              echo "::error title=Duplicate Pages artifacts::Expected one ${ARTIFACT_NAME} artifact, found ${count}."
              exit 1
            fi
            sleep 5
          done
          echo "::error title=Pages artifact unavailable::${ARTIFACT_NAME} was not visible to the GitHub API after 60 seconds."
          exit 1
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
