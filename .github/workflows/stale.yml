name: Stale

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: Mark inactive issues and pull requests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          days-before-issue-stale: 60
          days-before-issue-close: 14
          days-before-pr-stale: 30
          days-before-pr-close: 14
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: security,pinned,good first issue,help wanted
          exempt-pr-labels: security,pinned
          operations-per-run: 50
          stale-issue-message: >
            This issue has had no activity for 60 days. It will close in 14 days
            unless someone comments. A comment is enough to keep it open.
          close-issue-message: >
            Closed because the issue stayed inactive after the stale notice.
            Open a new issue if it still happens on the current release.
          stale-pr-message: >
            This pull request has had no activity for 30 days. It will close in
            14 days unless someone comments or pushes a commit.
          close-pr-message: >
            Closed because the pull request stayed inactive after the stale notice.
