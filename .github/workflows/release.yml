name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach artifacts to
        required: true
        default: v1.0.0

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build --workspace @neofile/web
      - run: node scripts/size-budget.mjs

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - run: npm ci
      - name: Build signed release APK
        run: bash scripts/build-android.sh
      - name: Rename APK
        run: cp artifacts/NeoFile-release.apk artifacts/NeoFile-1.0.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: artifacts/NeoFile-1.0.0.apk

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux webview dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf build-essential file libssl-dev
      - run: npm ci
      - name: Build deb and AppImage
        working-directory: apps/desktop
        run: npx tauri build --bundles deb,appimage
      - name: Collect packages
        run: |
          mkdir -p dist-release
          cp apps/desktop/src-tauri/target/release/bundle/deb/*.deb dist-release/NeoFile_1.0.0_amd64.deb
          cp apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage dist-release/NeoFile_1.0.0_amd64.AppImage
          chmod +x dist-release/*.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist-release/*

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Build NSIS and MSI installers
        working-directory: apps/desktop
        run: npx tauri build --bundles nsis,msi
      - name: Collect installers
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist-release | Out-Null
          Copy-Item apps/desktop/src-tauri/target/release/bundle/nsis/*.exe dist-release/NeoFile_1.0.0_x64-setup.exe
          Copy-Item apps/desktop/src-tauri/target/release/bundle/msi/*.msi dist-release/NeoFile_1.0.0_x64.msi
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist-release/*

  macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            asset: NeoFile_1.0.0_aarch64.dmg
          - target: x86_64-apple-darwin
            asset: NeoFile_1.0.0_x64.dmg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: npm ci
      - name: Build DMG
        working-directory: apps/desktop
        run: npx tauri build --target ${{ matrix.target }} --bundles dmg
      - name: Collect DMG
        run: |
          mkdir -p dist-release
          cp apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg "dist-release/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.target }}
          path: dist-release/${{ matrix.asset }}

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install CocoaPods
        run: sudo gem install cocoapods --no-document
      - run: npm ci
      - name: Build unsigned IPA
        run: bash scripts/build-ios-unsigned.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: artifacts/NeoFile-1.0.0-unsigned.ipa

  publish:
    if: always()
    needs: [test, android, linux, windows, macos, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-files
      - name: Flatten artifacts and add the logo
        run: |
          mkdir -p publish
          find release-files -type f -exec cp {} publish/ \;
          cp assets/logo.svg assets/logo-1024.png publish/
          ls -lh publish
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: NeoFile ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: publish/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Fail the release if a platform build failed
        if: >-
          needs.test.result != 'success' ||
          needs.android.result != 'success' ||
          needs.linux.result != 'success' ||
          needs.windows.result != 'success' ||
          needs.macos.result != 'success' ||
          needs.ios.result != 'success'
        run: |
          echo "One or more platform jobs failed."
          exit 1
