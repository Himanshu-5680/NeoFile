name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach artifacts to
        required: true
        default: v1.0.0

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build --workspace @neofile/web
      - run: node scripts/size-budget.mjs

  android:
    runs-on: ubuntu-latest
    outputs:
      signing: ${{ steps.mode.outputs.mode }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          if [ ! -d "$SDK/cmdline-tools" ]; then
            echo "Android SDK cmdline-tools not found under $SDK" >&2
            ls -la /usr/local/lib/android/sdk || true
            exit 1
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          else
            SM="$(find "$SDK/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort | tail -1)"
          fi
          echo "Using $SM"
          yes | "$SM" --licenses >/dev/null || true
          "$SM" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - run: npm ci
      - name: Version
        run: echo "NEOFILE_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
      - name: Decode release keystore when the secret is set
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            mkdir -p apps/web/signing
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > apps/web/signing/neofile-release.keystore
            echo "Using the configured release keystore."
          else
            echo "ANDROID_KEYSTORE_BASE64 is empty. The APK will be signed with a throwaway key."
          fi
      - name: Build APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "${ANDROID_KEYSTORE_PASSWORD}" ]; then unset ANDROID_KEYSTORE_PASSWORD; fi
          if [ -z "${ANDROID_KEY_PASSWORD}" ]; then unset ANDROID_KEY_PASSWORD; fi
          if [ -z "${ANDROID_KEY_ALIAS}" ]; then unset ANDROID_KEY_ALIAS; fi
          bash scripts/build-android.sh
          cp artifacts/NeoFile-release.apk "artifacts/NeoFile-${NEOFILE_VERSION}.apk"
      - name: Record signing mode
        id: mode
        run: |
          mode="$(tr -d '[:space:]' < artifacts/android-signing-mode.txt)"
          if [ "$mode" != "throwaway" ] && [ "$mode" != "configured" ]; then
            echo "Unexpected signing mode: $mode" >&2
            exit 1
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: artifacts/NeoFile-${{ env.NEOFILE_VERSION }}.apk

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux webview dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            file \
            libssl-dev \
            wget \
            xz-utils
          sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2 || true
      - run: npm ci
      - name: Version
        run: echo "NEOFILE_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
      - name: Build deb and AppImage
        working-directory: apps/desktop
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: npx tauri build --bundles deb,appimage
      - name: Collect packages
        run: |
          mkdir -p dist-release
          shopt -s nullglob
          debs=(apps/desktop/src-tauri/target/release/bundle/deb/*.deb)
          images=(apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage)
          if [ "${#debs[@]}" -eq 0 ] || [ "${#images[@]}" -eq 0 ]; then
            echo "Linux bundles were not produced." >&2
            find apps/desktop/src-tauri/target/release/bundle -type f || true
            exit 1
          fi
          cp "${debs[0]}" "dist-release/NeoFile_${NEOFILE_VERSION}_amd64.deb"
          cp "${images[0]}" "dist-release/NeoFile_${NEOFILE_VERSION}_amd64.AppImage"
          chmod +x dist-release/*.AppImage
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: dist-release/*

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Version
        shell: pwsh
        run: |
          $ver = $env:RELEASE_TAG -replace '^v',''
          "NEOFILE_VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build NSIS and MSI installers
        working-directory: apps/desktop
        run: npx tauri build --bundles nsis,msi
      - name: Collect installers
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist-release | Out-Null
          $exe = Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          $msi = Get-ChildItem apps/desktop/src-tauri/target/release/bundle/msi/*.msi
          if (-not $exe -or -not $msi) { throw "Windows installers were not produced." }
          Copy-Item $exe[0].FullName "dist-release/NeoFile_$($env:NEOFILE_VERSION)_x64-setup.exe"
          Copy-Item $msi[0].FullName "dist-release/NeoFile_$($env:NEOFILE_VERSION)_x64.msi"
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist-release/*

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target: aarch64-apple-darwin
            suffix: aarch64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            suffix: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: npm ci
      - name: Version
        run: echo "NEOFILE_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
      - name: Build DMG
        working-directory: apps/desktop
        run: npx tauri build --target ${{ matrix.target }} --bundles dmg
      - name: Collect DMG
        run: |
          mkdir -p dist-release
          shopt -s nullglob
          dmgs=(apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg)
          if [ "${#dmgs[@]}" -eq 0 ]; then
            echo "DMG was not produced for ${{ matrix.target }}." >&2
            find apps/desktop/src-tauri/target -name '*.dmg' -o -name '*.app' | head -50 || true
            exit 1
          fi
          cp "${dmgs[0]}" "dist-release/NeoFile_${NEOFILE_VERSION}_${{ matrix.suffix }}.dmg"
      - uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.suffix }}
          path: dist-release/NeoFile_${{ env.NEOFILE_VERSION }}_${{ matrix.suffix }}.dmg

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install CocoaPods
        run: |
          if ! command -v pod >/dev/null 2>&1; then
            brew install cocoapods
          fi
          pod --version
      - run: npm ci
      - name: Version
        run: echo "NEOFILE_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
      - name: Build unsigned IPA
        run: bash scripts/build-ios-unsigned.sh
        env:
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
      - uses: actions/upload-artifact@v7
        with:
          name: ios
          path: artifacts/NeoFile-${{ env.NEOFILE_VERSION }}-unsigned.ipa

  publish:
    needs: [test, android, linux, windows, macos, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Version
        run: echo "NEOFILE_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v8
        with:
          path: release-files
      - name: Collect release files and write notes
        env:
          SIGNING_MODE: ${{ needs.android.outputs.signing }}
        run: |
          set -euo pipefail
          ver="$NEOFILE_VERSION"
          mkdir -p publish
          find release-files -type f \
            \( -name '*.apk' -o -name '*.exe' -o -name '*.msi' -o -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' -o -name '*.ipa' \) \
            -exec cp {} publish/ \;
          cp assets/logo.svg assets/logo-1024.png publish/
          required=(
            "NeoFile-${ver}.apk"
            "NeoFile_${ver}_x64-setup.exe"
            "NeoFile_${ver}_x64.msi"
            "NeoFile_${ver}_aarch64.dmg"
            "NeoFile_${ver}_x64.dmg"
            "NeoFile_${ver}_amd64.deb"
            "NeoFile_${ver}_amd64.AppImage"
            "NeoFile-${ver}-unsigned.ipa"
            "logo.svg"
            "logo-1024.png"
          )
          missing=0
          for name in "${required[@]}"; do
            if [ ! -f "publish/$name" ]; then
              echo "Missing $name" >&2
              missing=1
            fi
          done
          echo "Publish directory:"
          ls -lh publish
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          if [ "$SIGNING_MODE" = "configured" ]; then
            signing_note="This APK was signed with the release keystore configured in the repository secrets."
          else
            signing_note="This APK was signed with a throwaway key generated during the GitHub Actions build because ANDROID_KEYSTORE_BASE64 (and the matching password secrets) were not set. The key is not stored in the repository and is not a Play Store signing key. The APK installs. An update built with a different key will not install over this one until the app is uninstalled."
          fi
          cat > publish/RELEASE_NOTES.md <<EOF
          ## NeoFile ${RELEASE_TAG}

          Offline neo-brutalist file viewer and editor for Android, iOS, Windows, macOS, and Linux. Text and CSV are editable. Spreadsheet cells can be edited as values. PDF, Word, PowerPoint, and media are previews. Nothing is uploaded.

          ### Downloads

          | Platform | File |
          | --- | --- |
          | Android | NeoFile-${ver}.apk |
          | Windows | NeoFile_${ver}_x64-setup.exe and NeoFile_${ver}_x64.msi |
          | macOS Apple silicon | NeoFile_${ver}_aarch64.dmg |
          | macOS Intel | NeoFile_${ver}_x64.dmg |
          | Linux | NeoFile_${ver}_amd64.deb and NeoFile_${ver}_amd64.AppImage |
          | iOS | NeoFile-${ver}-unsigned.ipa |

          logo.svg and logo-1024.png are the same mark used as the app icon.

          ### Install

          - **Android:** ${signing_note}
          - **Windows:** SmartScreen may say "Windows protected your PC" because the installer is not Authenticode-signed. NeoFile cannot remove that warning. Closing the window hides NeoFile in the tray. Quit from the tray menu.
          - **macOS:** Gatekeeper can block the app because it is not notarized. These notes do not include a command to remove that block. Use the arm64 disk image on Apple silicon and the x64 image on Intel.
          - **iOS:** The IPA is unsigned and is not a normal install. iOS will not install it from Files. The web desk on the project site is the separate browser copy.
          - **Linux:** sudo apt install ./NeoFile_${ver}_amd64.deb, or chmod +x the AppImage and run it. The deb needs WebKitGTK 4.1.

          ### Android signing

          ${signing_note}
          EOF
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: NeoFile ${{ env.RELEASE_TAG }}
          body_path: publish/RELEASE_NOTES.md
          files: |
            publish/*.apk
            publish/*.exe
            publish/*.msi
            publish/*.dmg
            publish/*.deb
            publish/*.AppImage
            publish/*.ipa
            publish/logo.svg
            publish/logo-1024.png
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
